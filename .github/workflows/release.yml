name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<< "$latest"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          if [ "$latest" = "0.0.0" ]; then major=1; minor=0; patch=0; fi
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Package addon
        run: |
          mkdir -p dist/yunagearopt
          cp *.lua dist/yunagearopt/
          # The addon compares this number with the latest release to show its update notice
          sed -i "s/^addon.version *= *'[^']*';/addon.version = '${{ steps.version.outputs.version }}';/" dist/yunagearopt/yunagearopt.lua
          mkdir -p dist/yunagearopt/gearswap dist/yunagearopt/legacyac dist/yunagearopt/lac
          cp gearswap/README.txt dist/yunagearopt/gearswap/
          cp legacyac/README.txt dist/yunagearopt/legacyac/
          cp lac/README.txt dist/yunagearopt/lac/
          cp README.md dist/yunagearopt/
          (cd dist && zip -r "yunagearopt-${{ steps.version.outputs.version }}.zip" yunagearopt)

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          args=(--title "v$v" --target "$GITHUB_SHA" --generate-notes)
          if [ "${{ steps.version.outputs.previous }}" != "0.0.0" ]; then
            args+=(--notes-start-tag "${{ steps.version.outputs.previous }}")
          fi
          gh release create "$v" "dist/yunagearopt-$v.zip" "${args[@]}"
