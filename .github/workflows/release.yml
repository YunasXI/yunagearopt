name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<< "$latest"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          if [ "$latest" = "0.0.0" ]; then major=1; minor=0; patch=0; fi
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Package addon (VanaCore)
        run: |
          # YunaGearOpt is a VanaCore addon: it goes in VanaCore\addons\vanacore\yunagearopt
          mkdir -p dist/yunagearopt
          python3 native/build.py dist/yunagearopt
          # The version shown in the window
          sed -i "s/^addon.version *= *'[^']*';/addon.version = '${{ steps.version.outputs.version }}';/" dist/yunagearopt/core.lua dist/yunagearopt/yunagearopt.lua
          (cd dist && zip -r "yunagearopt-${{ steps.version.outputs.version }}.zip" yunagearopt)

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          prev="${{ steps.version.outputs.previous }}"
          # The notes are the commit titles since the last release: the addon shows them in its update pop-up
          if [ "$prev" != "0.0.0" ]; then notes=$(git log --no-merges --format='- %s' "$prev"..HEAD); fi
          notes=${notes:-"- Maintenance build"}
          gh release create "$v" "dist/yunagearopt-$v.zip" --title "v$v" --target "$GITHUB_SHA" --notes "$notes"
